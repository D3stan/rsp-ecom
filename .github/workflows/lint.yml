name: linter

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # shortcut: existing PHP is not Pint-clean (~175 files), so only files added in the PR are checked; drop the filter once the backlog is formatted.
      - name: Check Pint (new PHP files)
        if: github.event_name == 'pull_request'
        run: git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- '*.php' | xargs -r vendor/bin/pint --test

      - name: Check Frontend Format
        run: npm run format:check

      - name: Lint Frontend
        run: npx eslint .

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
