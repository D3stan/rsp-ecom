name: tests

on:
  push:
    branches:
      - sandbox
      - main
  pull_request:
    branches:
      - sandbox
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check
        run: npm run types

      - name: JS Tests
        run: npm run test:js

      - name: Python Tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build Assets
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Docs Check
        run: python3 scripts/docs_check.py

      - name: Agent Files In Sync
        run: |
          php artisan boost:update --no-interaction
          git diff --exit-code -- CLAUDE.md AGENTS.md .agents/skills .ai/rules/index.md .ai/rules/boost

      - name: Tests
        run: ./vendor/bin/pest
